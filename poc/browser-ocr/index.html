<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local OCR Browser PoC</title>
  </head>
  <body>
    <main>
      <h1>Local OCR Browser PoC</h1>
      <p>
        PP-OCRv5 mobileモデルとONNX Runtime Web WASMをローカルから読み込み、画像1枚をOCRします。
      </p>

      <section class="controls" aria-label="OCR入力">
        <label for="image-input">画像ファイル</label>
        <input
          id="image-input"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/bmp"
        />
        <button id="latin-sample-button" type="button">英数字サンプルでOCR</button>
        <button id="japanese-sample-button" type="button">日本語サンプルでOCR</button>
      </section>

      <p id="status" class="status" data-state="idle" role="status" aria-live="polite">
        画像を選択してください。
      </p>
      <p class="diagnostic">
        UI heartbeat: <span id="ui-heartbeat" data-testid="ui-heartbeat">0</span>
      </p>

      <section class="results" aria-label="OCR結果">
        <div>
          <h2>入力画像</h2>
          <img id="preview" alt="OCR対象画像のプレビュー" hidden />
        </div>
        <div>
          <h2>認識テキスト</h2>
          <pre id="recognized-text" data-testid="recognized-text"></pre>
          <details>
            <summary>正規化結果</summary>
            <pre id="result-json" data-testid="result-json"></pre>
          </details>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
